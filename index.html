<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICOFR/Control — CSA Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b2f7a;
  --navy-deep:#07235c;
  --blue-head:#0f4fd8;
  --orange:#e8620d;
  --orange-soft:#fdf3ea;
  --ink:#12181f;
  --muted:#6a7482;
  --line:#dfe4ea;
  --surface:#ffffff;
  --page:#f6f8fb;
  --green:#1e8e4a;
  --green-bg:#e3f6ea;
  --red:#c0392b;
  --red-bg:#fdeaea;
  --amber-bg:#fdf1dd;
  --amber-ink:#96570b;
  --radius:4px;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e9edf3; --muted:#9aa5b4; --line:#2a3340; --surface:#151b23; --page:#0e1319;
    --orange-soft:#2a1c10; --green-bg:#12291c; --red-bg:#2c1616; --amber-bg:#2b2010; --amber-ink:#e8b970;
    --blue-head:#6ea0ff; --navy:#12356f;
  }
}
:root[data-theme="dark"]{
  --ink:#e9edf3; --muted:#9aa5b4; --line:#2a3340; --surface:#151b23; --page:#0e1319;
  --orange-soft:#2a1c10; --green-bg:#12291c; --red-bg:#2c1616; --amber-bg:#2b2010; --amber-ink:#e8b970;
  --blue-head:#6ea0ff; --navy:#12356f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--ink);
  font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:13px; line-height:1.5;
}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--orange); outline-offset:2px}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}

/* ---------- chrome ---------- */
.topbar{background:var(--surface); border-bottom:3px solid var(--orange); position:sticky; top:0; z-index:40}
.topbar-in{max-width:1400px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:16px; letter-spacing:-.02em}
.shield{width:26px;height:26px;border-radius:5px;background:var(--navy);display:grid;place-items:center;color:#fff;font-size:13px}
.brand small{font-weight:500;color:var(--muted); font-size:10px; letter-spacing:.05em}
.navpill{background:#0d1520;color:#fff;border:0;padding:8px 16px;border-radius:var(--radius);font-weight:600;font-size:12.5px;cursor:pointer}
.spacer{flex:1}
.who{text-align:right;line-height:1.35}
.who b{font-size:12.5px}
.who span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.signout{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-weight:600;font-size:12.5px}

.wrap{max-width:1400px;margin:0 auto;padding:18px 20px 60px}
.crumb{color:var(--muted);font-size:11.5px;margin-bottom:10px}
.crumb b{color:var(--ink);font-weight:600}
.pagehead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:27px;margin:0;color:var(--blue-head);letter-spacing:-.02em;font-weight:800}
.sub{color:var(--muted);font-size:12px;margin-top:4px}
.sub b{color:var(--ink)}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{border-radius:var(--radius);padding:9px 15px;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid transparent;background:var(--surface);color:var(--ink);white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{border-color:var(--line)}
.btn-o{border-color:var(--orange);color:var(--orange);background:transparent}
.btn-orange{background:var(--orange);color:#fff}
.btn-navy{background:var(--navy);color:#fff}
.btn-danger{border-color:var(--red);color:var(--red);background:transparent}
.btn-sm{padding:6px 11px;font-size:11.5px}

/* ---------- cards / tables ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px}
.card-pad{padding:18px}
.card h2{font-size:16px;margin:0 0 14px;color:var(--blue-head);font-weight:800}
.sec-label{font-size:10.5px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:20px 0 8px;display:flex;align-items:center;gap:10px}
.sec-label:after{content:"";flex:1;height:1px;background:var(--line)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:720px}
thead th{background:var(--orange);color:#fff;text-align:left;padding:10px 12px;font-weight:700;font-size:11px;letter-spacing:.02em;vertical-align:bottom}
thead.navy th{background:var(--navy)}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:rgba(127,140,160,.045)}
.nowrap{white-space:nowrap}

/* ---------- form ---------- */
label.f{display:block;font-size:10.5px;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:5px}
input[type=text],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);font-size:13px;font-family:inherit}
textarea{resize:vertical;min-height:76px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:14px}

/* ---------- misc ---------- */
.badge{display:inline-block;padding:3px 9px;border-radius:3px;font-size:10.5px;font-weight:700;letter-spacing:.03em}
.b-pass{background:var(--green-bg);color:var(--green)}
.b-fail{background:var(--red-bg);color:var(--red)}
.b-info{background:var(--amber-bg);color:var(--amber-ink)}
.b-grey{background:rgba(127,140,160,.16);color:var(--muted)}
.b-navy{background:rgba(11,47,122,.12);color:var(--blue-head)}
.insight{background:var(--navy);color:#fff;padding:16px 18px;border-radius:var(--radius);margin-bottom:16px}
.insight h3{margin:0 0 7px;font-size:14px}
.insight p{margin:0;font-size:12px;line-height:1.65;opacity:.94}
.steps{display:flex;gap:26px;justify-content:center;margin:6px 0 22px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.step i{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;background:rgba(127,140,160,.2);color:var(--muted)}
.step.on{color:var(--orange)} .step.on i{background:var(--orange);color:#fff}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:10px 2px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:0;border-left:0;border-right:0}
.tab.on{color:var(--orange);border-bottom-color:var(--orange)}
.samplebar{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;background:var(--surface)}
.metarow{display:flex;gap:26px;flex-wrap:wrap;margin-top:10px}
.meta{min-width:120px}
.meta span{display:block;font-size:9.5px;letter-spacing:.07em;color:var(--muted);font-weight:700}
.meta b{font-weight:500;font-size:12.5px}
.note{background:var(--amber-bg);color:var(--amber-ink);border-radius:var(--radius);padding:10px 13px;font-size:11.5px;margin-top:12px}
.hint{background:var(--orange-soft);border-left:3px solid var(--orange);padding:9px 12px;font-size:11px;color:var(--muted);line-height:1.6}
.link{color:var(--orange);font-weight:600;cursor:pointer;text-decoration:none;background:none;border:0;padding:0;font-size:inherit}
.center-empty{text-align:center;color:var(--muted);padding:26px;font-size:12.5px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,14,22,.55);display:grid;place-items:center;padding:20px;z-index:60}
.modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:560px;max-height:88vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.modal.lg{max-width:960px}
.modal-h{padding:18px 20px 0;display:flex;align-items:flex-start;gap:12px}
.modal-h h3{margin:0;font-size:16px;color:var(--blue-head);font-weight:800}
.modal-b{padding:14px 20px}
.modal-f{padding:14px 20px 18px;display:flex;justify-content:flex-end;gap:8px}
.x{margin-left:auto;background:none;border:0;font-size:18px;color:var(--muted);cursor:pointer;line-height:1}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;max-width:520px;width:100%;padding:30px}
.role{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--radius);padding:14px;cursor:pointer;margin-bottom:10px}
.role:hover{border-color:var(--orange)}
.role b{display:block;font-size:13.5px}
.role span{font-size:11.5px;color:var(--muted)}
.role i{width:30px;height:30px;border-radius:4px;background:var(--navy);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;flex:none}

/* toast */
.toast{position:fixed;top:14px;right:14px;background:#14532d;color:#fff;padding:12px 16px;border-radius:var(--radius);font-size:12.5px;z-index:80;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.docprev{border:1px solid var(--line);border-radius:var(--radius);padding:16px;font-size:10.5px;line-height:1.7;background:var(--surface)}
.docprev h4{margin:0 0 8px;font-size:11px;text-align:center;letter-spacing:.06em}
.docprev .r{display:flex;gap:8px}
.docprev .r span:first-child{width:150px;color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.evbox{border:1px solid var(--navy);border-radius:var(--radius);padding:14px}
.evgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.evcell{background:rgba(127,140,160,.08);padding:10px;border-radius:3px}
.evcell span{display:block;font-size:9.5px;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:5px}
@media (max-width:820px){.grid2,.split,.evgrid{grid-template-columns:1fr}h1{font-size:22px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ============================================================
   ICOFR/Control — CSA prototype (in-house POC)
   ============================================================ */

const PROCEDURES = [
 {step:1, text:"Meninjau keselarasan dokumen prakarsa kredit (e.g. memiliki nama yang sama) dan akurasi informasi pengajuan permohonan kredit dari Account Officer pada Sistem."},
 {step:2, text:"Meninjau permohonan kredit dengan mempertimbangkan hal-hal sebagai berikut pada Form Rekomendasi Pinjaman:\na. Hasil penilaian kredit kuantitatif (Credit Scoring Risk / CRS) pada Sistem\nb. Rekomendasi pinjaman yang diajukan oleh Account Officer (suku bunga, tipe dan struktur kredit)"},
 {step:3, text:"Meninjau seluruh dokumen pendukung permohonan kredit yang diunggah terhadap kesesuaian dan konsistensi data tanpa adanya ketidakselarasan informasi dengan sampel."},
 {step:4, text:"Suku bunga per tahun harus di dalam rentang 5 sampai 10 persen pada Form Rekomendasi Pinjaman."},
 {step:5, text:"Memastikan jumlah permohonan pada Form Permohonan Pinjaman lebih rendah atau sama dengan plafond pinjaman pada Form Rekomendasi Pinjaman."},
 {step:6, text:"Memastikan jangka waktu pinjaman sesuai antara sampel dengan Form Rekomendasi Pinjaman sebagai dokumen persetujuan permohonan pinjaman."}
];

const DOC_REQS = [
 {no:1, name:"Form Permohonan Pinjam", prompt:""},
 {no:2, name:"Identitas pemohon (KTP)", prompt:"- Pastikan nilai NIK pada KTP hanya terdiri dari 16 digit angka.\n- Pastikan nama pada KTP tidak kosong dan sesuai dengan nama pemohon pada Form Permohonan Pinjaman.\n- Pastikan tempat/tanggal lahir pada KTP memuat tempat lahir dan tanggal kalender yang valid.\n- Pastikan alamat pada KTP tidak kosong.\n- Pastikan pekerjaan pada KTP tidak kosong.\n- Pastikan masa berlaku KTP mencantumkan tanggal yang masih berlaku atau tertulis \"SEUMUR HIDUP\"."},
 {no:3, name:"Form Rekomendasi Pinjaman oleh Account Officer", prompt:""}
];

const AI_RESULTS = [
 {step:1, result:"FAIL", conf:98, insight:"Nama pemohon pada dokumen prakarsa kredit tidak sesuai dengan nama pada sampel transaksi, karena Nama Ymp pada Form Pinjaman.jpg tercatat sebagai SANAN, sedangkan nama pemohon seharusnya GUOHUI CHEN.", source:"Form Pinjaman.jpg", sampleVal:"GUOHUI CHEN", evVal:"SANAN", evLabel:"NAMA PEMOHON", verdictEv:"MISMATCH"},
 {step:2, result:"FAIL", conf:91, insight:"Tidak ditemukan bukti hasil penilaian kredit kuantitatif (Credit Scoring Risk / CRS) dari sistem pada Form Rekomendasi Pinjaman (Credit Scoring).png, meskipun informasi rekomendasi pinjaman lainnya seperti suku bunga, tipe, dan jangka waktu telah tercantum.", source:"Form Rekomendasi Pinjaman (Credit Scoring).png", sampleVal:"Wajib ada skor CRS sistem", evVal:"Tidak ditemukan", evLabel:"CREDIT SCORING", verdictEv:"NOT FOUND"},
 {step:3, result:"FAIL", conf:100, insight:"Masa berlaku KTP pada dokumen KTP.pdf telah habis karena tanggal Berlaku Hingga tercatat 12-12-2023, sehingga tidak memenuhi persyaratan masih aktif atau 'SEUMUR HIDUP'.", source:"KTP.pdf", sampleVal:"Aktif / SEUMUR HIDUP", evVal:"12-12-2023", evLabel:"BERLAKU HINGGA", verdictEv:"EXPIRED"},
 {step:4, result:"PASS", conf:99, insight:"Suku bunga per tahun sebesar 6.0 % pada Form Rekomendasi Pinjaman (Credit Scoring).png berada dalam rentang yang ditentukan, yaitu antara 5 hingga 10 persen, sehingga memenuhi persyaratan.", source:"Form Rekomendasi Pinjaman (Credit Scoring).png", sampleVal:"5% – 10%", evVal:"6,00 %", evLabel:"SUKU BUNGA", verdictEv:"MATCH"},
 {step:5, result:"FAIL", conf:74, insight:"Jumlah Permohonan pada Form Pinjaman.jpg tercatat Rp 50.000.000, namun tidak sesuai dengan ketentuan bahwa jumlah permohonan harus lebih rendah atau sama dengan Plafond Pinjaman pada Form Rekomendasi Pinjaman (Credit Scoring).png, yang juga tercatat Rp 50.000.000, menunjukkan potensi ketidaksesuaian interpretasi atau kesalahan dokumentasi.", source:"Form Pinjaman.jpg", sampleVal:"Rp 50.000.000", evVal:"Rp 50.000.000", evLabel:"JUMLAH PERMOHONAN", verdictEv:"MISMATCH"},
 {step:6, result:"FAIL", conf:100, insight:"Jangka Waktu pada sampel tercatat 2 tahun, sedangkan pada Form Rekomendasi Pinjaman (Credit Scoring).png tercantum 24 bulan; meskipun secara nilai setara, ketidaksesuaian format menciptakan ketidakselarasan yang mengakibatkan kegagalan verifikasi.", source:"Form Rekomendasi Pinjaman (Credit Scoring).png", sampleVal:"2 tahun", evVal:"24 bulan", evLabel:"JANGKA WAKTU", verdictEv:"MISMATCH"}
];

const SUMMARY = "Temuan menunjukkan ketidaksesuaian kritis pada beberapa aspek dokumen kredit, termasuk ketidakcocokan data Nama Ymp pada Form Pinjaman.jpg, ketidaksesuaian Berlaku Hingga pada KTP.pdf, ketidaksesuaian antara Jumlah Permohonan pada Form Pinjaman.jpg dengan Plafond Pinjaman pada Form Rekomendasi Pinjaman (Credit Scoring).png, serta ketidaksesuaian Jangka Waktu pada Form Rekomendasi Pinjaman (Credit Scoring).png. Selain itu, tidak terdapat bukti hasil penilaian kredit kuantitatif (Credit Scoring Risk / CRS) dari sistem pada Form Rekomendasi Pinjaman (Credit Scoring).png, yang merupakan kegagalan kritis dalam memenuhi persyaratan validasi kredit.";

const ORG_UNITS = [
 {name:"Cabang Balikpapan Hub (BALIKPAPAN)", id:"BPN-001", area:"Kalimantan"},
 {name:"Cabang Bandung Raya (BANDUNG)", id:"BDG-001", area:"Jawa Barat"},
 {name:"Cabang Denpasar Bali (DENPASAR)", id:"DPS-001", area:"Bali Nusra"},
 {name:"Cabang Jakarta Kemayoran (JAKARTA)", id:"JKT-001", area:"Jakarta"},
 {name:"Cabang Makassar Utama (MAKASSAR)", id:"MKS-001", area:"Sulawesi"},
 {name:"Cabang Medan Kota (MEDAN)", id:"MDN-001", area:"Sumatera"}
];

const SAMPLE_ROW = {
  sample:"Sample1", regional:"Jakarta", branch:"Cabang Jakarta Kemayoran",
  lnType:"SX", desc:"KREDIT MIKRO", rekening:"81101032799101",
  nik:"3203012503770011", nama:"GUOHUI CHEN", jangka:"2 tahun",
  plafond:"Rp 50.000.000", bunga:"6,00 %", tglSkpp:"08-01-2025"
};

/* ---------------- state ---------------- */
const blank = () => ({
  role:null, page:"login", tab:"analysis",
  a:{
    control:"CT.C.04", period:"Q2 2026", initiator:"Preparer Branch", reviewer:"Reviewer Branch",
    attribute:"Seluruh persyaratan dokumen telah dipenuhi sesuai dengan checklist di dalam Sistem.",
    procedures:PROCEDURES.map(p=>({...p})),
    docs:DOC_REQS.map(d=>({...d})),
    scope:[], scopeSubmitted:false,
    status:"DRAFT",
    returned:false, prepStep:1, sampleUploaded:false, uploads:{}, analyzed:false, analyzing:false,
    results:[], nd:{no:"", tgl:"27-Aug-2026", to:"Pimpinan Cabang", from:"Branch Reviewer Team", cause:"", plan:""},
    trail:[]
  }
});
let S = blank();

const KEY="icofr_poc_v1";
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const r=localStorage.getItem(KEY); if(r){ const p=JSON.parse(r); if(p&&p.a) S=p; } }catch(e){} }
function log(actor, action){ S.a.trail.unshift({t:new Date().toLocaleString("id-ID"), actor, action}); }

const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nl = s => esc(s).replace(/\n/g,"<br>");

function toast(msg){
  document.getElementById("toast").innerHTML = `<div class="toast">✔ ${esc(msg)}</div>`;
  setTimeout(()=>{ const t=document.getElementById("toast"); if(t) t.innerHTML=""; }, 2600);
}
function go(page){ S.page=page; save(); render(); window.scrollTo(0,0); }

/* ---------------- chrome ---------------- */
const ROLE_META = {
  admin:{who:"Orchestrator — Line 2", scope:"HEAD OFFICE / DIVISI MRO", nav:"Assessments"},
  preparer:{who:"Preparer Branch", scope:"BRANCH PREPARER — JAKARTA / CABANG JAKARTA KEMAYORAN", nav:"My Assignments"},
  reviewer:{who:"Reviewer Branch", scope:"BRANCH REVIEWER — JAKARTA / CABANG JAKARTA KEMAYORAN", nav:"Reviews"}
};

function topbar(){
  const m = ROLE_META[S.role];
  return `<div class="topbar"><div class="topbar-in">
    <div class="brand"><span class="shield">◈</span>ICOFR/Control <small class="mono">v0.1</small></div>
    <button class="navpill" data-go="${S.role==='admin'?'admin-list':S.role==='preparer'?'prep-dash':'rev-dash'}">${m.nav}</button>
    <div class="spacer"></div>
    <div class="who"><b>${esc(m.who)}</b><span class="mono">${esc(m.scope)}</span></div>
    <button class="signout" data-act="signout">↪ Sign out</button>
  </div></div>`;
}
const crumb = (...p) => `<div class="crumb">${p.map((x,i)=>i===p.length-1?`<b>${esc(x)}</b>`:esc(x)).join(" &nbsp;›&nbsp; ")}</div>`;

/* ---------------- pages ---------------- */
function pageLogin(){
  return `<div class="login"><div class="login-card">
    <div class="brand" style="margin-bottom:6px"><span class="shield">◈</span>ICOFR/Control <small class="mono">v0.1</small></div>
    <p style="color:var(--muted);margin:0 0 22px;font-size:12.5px">Control self-assessment untuk Internal Control over Financial Reporting. Pilih peran untuk masuk ke prototipe.</p>
    <button class="role" data-login="admin"><i>L2</i><div><b>Orchestrator — Line 2</b><span>Susun RCM & testing procedure, atur prompt validasi, alokasikan CSA ke unit kerja, pantau progres.</span></div></button>
    <button class="role" data-login="preparer"><i>L1</i><div><b>Preparer — Line 1</b><span>Unggah sampel transaksi dan dokumen pendukung, jalankan analisis, kirim ke reviewer.</span></div></button>
    <button class="role" data-login="reviewer"><i>1.5</i><div><b>Reviewer — Line 1.5</b><span>Tinjau insight AI, override verdict bila perlu, tandai selesai, dan terbitkan nota dinas.</span></div></button>
    <p style="color:var(--muted);font-size:11px;margin:16px 0 0">Data prototipe tersimpan di browser ini saja. <button class="link" data-act="reset">Reset data demo</button></p>
  </div></div>`;
}

/* ---- ADMIN ---- */
function pageAdminList(){
  const a=S.a;
  return topbar()+`<div class="wrap">
    ${crumb("Home","Assessments")}
    <div class="pagehead"><div><h1>Assessments</h1><div class="sub">Periode <b>${esc(a.period)}</b> · pemetaan kontrol dan alokasi CSA</div></div>
      <div class="actions"><button class="btn btn-orange" data-go="admin-create">+ New assessment</button></div></div>
    <div class="card"><div class="tblwrap"><table>
      <thead><tr><th>ICOFR Control No.</th><th>Control attribute</th><th class="nowrap">Scope allocated</th><th class="nowrap">Period</th><th>Status</th><th class="nowrap">Action</th></tr></thead>
      <tbody><tr>
        <td class="mono">${esc(a.control)}</td>
        <td>${esc(a.attribute)}</td>

let M = null;
function openModal(kind, data){ M={kind,data}; renderModal(); }
function closeModal(){ M=null; renderModal(); }

function renderModal(){
  const host=document.getElementById("modal");
  if(!M){ host.innerHTML=""; return; }
  const a=S.a;
  let body="";

  if(M.kind==="prompt"){
    const d=a.docs.find(x=>x.no===M.data);

/* keep checkbox choices alive across modal re-renders */
function capturePicks(){
  if(!M || M.kind!=="scope") return;
  const shown=[...document.querySelectorAll("[data-pick]")].map(c=>c.dataset.pick);
  const checked=[...document.querySelectorAll("[data-pick]:checked")].map(c=>c.dataset.pick);
  M.data.sel = M.data.sel.filter(id=>!shown.includes(id)).concat(checked);
}
function filterScope(q){
  q=(q||"").trim().toLowerCase();
  const rows=[...document.querySelectorAll("[data-search]")];
  rows.forEach(tr=>{ tr.style.display = !q || tr.dataset.search.includes(q) ? "" : "none"; });
  document.querySelectorAll(".grouphead").forEach(h=>{
    const kids=rows.filter(r=>r.dataset.of===h.dataset.group && r.style.display!=="none");
    h.style.display = kids.length ? "" : "none";
  });
  const empty=document.getElementById("scopeempty");
  if(empty) empty.style.display = rows.some(r=>r.style.display!=="none") ? "none" : "";
}

/* ---------------- render ---------------- */
function render(){
  const app=document.getElementById("app");
  const map={
    "login":pageLogin, "admin-list":pageAdminList, "admin-create":pageAdminCreate,
    "prep-dash":pagePrepDash, "prep-detail":pagePrepDetail,
    "rev-dash":pageRevDash, "rev-detail":pageRevDetail, "rev-report":pageRevReport
  };
  app.innerHTML = (map[S.page]||pageLogin)();
  renderModal();
}

/* ---------------- events ---------------- */
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-go],[data-act],[data-login],[data-tab],[data-prompt],[data-override],[data-evidence],[data-updoc],[data-deldoc],[data-unscope],[data-level]");
  if(!t) return;
  const a=S.a;

  if(t.dataset.login){
    S.role=t.dataset.login;
    go(S.role==="admin"?"admin-list":S.role==="preparer"?"prep-dash":"rev-dash"); return;
  }
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.tab){ S.tab=t.dataset.tab; save(); render(); return; }
  if(t.dataset.prompt){ openModal("prompt", parseInt(t.dataset.prompt)); return; }
  if(t.dataset.override){ openModal("override", parseInt(t.dataset.override)); return; }
  if(t.dataset.evidence){ openModal("evidence", parseInt(t.dataset.evidence)); return; }
  if(t.dataset.level){ capturePicks(); M.data.level=t.dataset.level; renderModal(); return; }
  if(t.dataset.unscope){ a.scope.splice(+t.dataset.unscope,1); save(); render(); return; }
  if(t.dataset.updoc){
    const no=+t.dataset.updoc;
    const names={1:"Form Pinjaman.jpg",2:"KTP.pdf",3:"Form Rekomendasi Pinjaman (Credit Scoring).png"};
    a.uploads[no]=names[no]; a.analyzed=false; a.results=[];
    log("Preparer Branch",`Mengunggah ${names[no]} untuk SMPL-1.`);
    save(); render(); toast(`Dokumen terunggah untuk SMPL-1 (${a.docs.find(d=>d.no===no).name})`); return;
  }
  if(t.dataset.deldoc){ delete a.uploads[+t.dataset.deldoc]; a.analyzed=false; a.results=[]; save(); render(); return; }

  const act=t.dataset.act;
  if(act==="signout"){ S.role=null; go("login"); return; }
  if(act==="reset"){ S=blank(); save(); render(); toast("Data demo direset"); return; }
  if(act==="closemodal"){ closeModal(); return; }

  /* admin */
  if(act==="mapscope"){ openModal("scope",{level:"Working Unit", sel:a.scope.map(s=>s.wuId)}); return; }
  if(act==="addscope"){
    capturePicks();
    const wuIds=new Set();
    M.data.sel.forEach(id=>{
      if(id.startsWith("AREA::")){
        const area=id.slice(6);
        ORG_UNITS.filter(o=>o.area===area).forEach(o=>{ wuIds.add(o.id+"-01"); wuIds.add(o.id+"-02"); });
      } else if(id.startsWith("ORG::")){
        const oid=id.slice(5); wuIds.add(oid+"-01"); wuIds.add(oid+"-02");
      } else wuIds.add(id);
    });
    a.scope=[...wuIds].sort().map(id=>{
      const org=ORG_UNITS.find(o=>id.startsWith(o.id));
      return {level:M.data.level, area:org.area, orgId:org.id, orgName:org.name, wuId:id, wuName:"Unit Kerja "+id.slice(-2)};
    });
    log("Orchestrator — Line 2", `Memetakan ${a.scope.length} working unit ke dalam scope CSA (level: ${M.data.level}).`);
    closeModal(); save(); render(); toast(`${a.scope.length} working unit ditambahkan ke scope`); return;
  }
  if(act==="genprompt"){
    const d=a.docs.find(x=>x.no===M.data);
    const box=document.getElementById("promptbox");
    box.value = d.no===2 ? DOC_REQS[1].prompt
      : d.no===1 ? "- Pastikan nama pemohon pada Form Permohonan Pinjaman sama persis dengan nama pada sampel transaksi.\n- Pastikan jumlah permohonan tercantum dalam angka dan tidak melebihi plafond pada Form Rekomendasi Pinjaman.\n- Pastikan formulir memuat tanggal pengajuan dan tanda tangan pemohon."
      : "- Pastikan Skor Penilaian Risiko Kredit (CRS) dari sistem tercantum dan tidak kosong.\n- Pastikan suku bunga per tahun berada pada rentang 5–10 persen.\n- Pastikan jangka waktu dinyatakan dalam satuan yang sama dengan sampel transaksi.";
    toast("Prompt dihasilkan"); return;
  }
  if(act==="saveprompt"){
    const d=a.docs.find(x=>x.no===M.data);
    d.prompt=document.getElementById("promptbox").value;
    log("Orchestrator — Line 2", `Memperbarui prompt validasi untuk ${d.name}.`);
    closeModal(); save(); render(); toast("Prompt tersimpan"); return;
  }
  if(act==="admin-save"){ save(); toast("Draft tersimpan"); return; }
  if(act==="dispatch"){
    a.scopeSubmitted=true; a.status="ASSIGNED";
    log("Orchestrator — Line 2", `CSA ${a.control} didistribusikan ke ${a.scope.length} working unit.`);
    save(); go("admin-list"); toast("CSA didistribusikan ke preparer"); return;
  }

  /* preparer */
  if(act==="template"){ toast("Template Sample.xlsx disiapkan (prototipe)"); return; }
  if(act==="uploadsample"){
    a.sampleUploaded=true; a.status="IN PROGRESS";
    log("Preparer Branch","Mengunggah Sample.xlsx (1 baris sampel terbaca).");
    save(); render(); toast("Sample.xlsx terunggah — 1 sampel terbaca"); return;
  }
  if(act==="delsample"){ a.sampleUploaded=false; a.uploads={}; a.analyzed=false; a.results=[]; save(); render(); return; }
  if(act==="next"){ a.prepStep=2; save(); render(); return; }
  if(act==="back1"){ a.prepStep=1; save(); render(); return; }
  if(act==="savedraft"){ save(); toast("Tersimpan sebagai draft"); return; }
  if(act==="discard"){ a.sampleUploaded=false; a.uploads={}; a.analyzed=false; a.results=[]; a.prepStep=1; a.status="ASSIGNED"; save(); go("prep-dash"); return; }
  if(act==="analyze"){
    a.analyzing=true; save(); render();
    setTimeout(()=>{
      a.analyzing=false; a.analyzed=true;
      a.results = AI_RESULTS.map(r=>({
        ...r, aiResult:r.result, procedure:PROCEDURES.find(p=>p.step===r.step).text,
        overridden:false, justification:"", hallucination:false
      }));
      log("System (AI)", `Analisis selesai: ${a.results.filter(r=>r.result==="FAIL").length} exception dari ${a.results.length} langkah.`);
      save(); render(); toast("Analisis dokumen pendukung selesai");
    }, 1500);
    return;
  }
  if(act==="submit"){
    a.status="UNDER REVIEW"; a.returned=false;
    log("Preparer Branch","Mengirim hasil assessment ke reviewer (Line 1.5).");
    save(); go("prep-dash"); toast("Terkirim ke reviewer"); return;
  }

  /* reviewer */
  if(act==="saveoverride"){
    const r=a.results.find(x=>x.step===M.data);
    const txt=document.getElementById("ovText").value.trim();
    if(!txt){ toast("Justifikasi wajib diisi"); return; }
    r.result=document.getElementById("ovVerdict").value;
    r.justification=txt;
    r.hallucination=document.getElementById("ovHallu").checked;
    r.overridden=true;
    log("Reviewer Branch", `Override step ${r.step}: ${r.aiResult} → ${r.result}${r.hallucination?" (ditandai potensi halusinasi AI)":""}.`);
    closeModal(); save(); render(); toast("Override tersimpan"); return;
  }
  if(act==="reject"){
    a.status="IN PROGRESS"; a.prepStep=2; a.returned=true;
    log("Reviewer Branch","Mengembalikan dokumen ke preparer untuk diperbaiki.");
    save(); go("rev-dash"); toast("Dikembalikan ke preparer"); return;
  }
  if(act==="complete"){
    a.status="COMPLETED";
    log("Reviewer Branch","Menandai assessment selesai. Report siap dibuat.");
    save(); go("rev-report"); toast("Assessment ditandai selesai"); return;
  }
  if(act==="prev-word"){ openModal("word"); return; }
  if(act==="prev-excel"){ openModal("excel"); return; }
});

document.addEventListener("input", e=>{
  const el=e.target;
  if(el.dataset.bind){ S.a[el.dataset.bind]=el.value; save(); }
  if(el.dataset.nd){ S.a.nd[el.dataset.nd]=el.value; save(); }
  if(el.id==="scopesearch") filterScope(el.value);
});

document.addEventListener("keydown", e=>{ if(e.key==="Escape"&&M) closeModal(); });

load();
if(!S.role) S.page="login";
render();
</script>
</body>
</html>
